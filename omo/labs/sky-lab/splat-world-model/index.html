{

function termTexture(lines, hue) {

}

// ---------- tour (room-local coordinates, eye 1.65 m) ----------
const deg = Math.PI / 180;
// [t, x, z, yaw(deg; 0 = look -z, -90 = look +x toward city), pitch(deg)]
const KEYS = [
  [0.00, -10.0, -7.4, -70, -4],
  [0.15, -6.0, -5.2, -95, -6],
  [0.27, -1.0, -4.6, -112, -9],   // passing desks, screens in view
  [0.37, 2.05, -3.75, -92, -14],  // close to a monitor: terminal text must be crisp
  [0.46, 5.6, -2.0, -90, -10],
  [0.56, 10.5, -1.5, -84, -22],   // at the glass, looking out and down
  [0.66, 10.7, -1.4, -66, -32],
  [0.76, 10.4, 1.6, -42, -16],
  [0.88, 9.2, 2.2, 40, -8],     // turning back to the room / lounge
  [1.00, 8.4, 1.0, 95, -6],
];
function smooth(a) { return a * a * (3 - 2 * a); }
function poseAt(t) {
  t = Math.min(1, Math.max(0, t)); let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const A = KEYS[i], B = KEYS[i + 1], P = KEYS[Math.max(0, i - 1)], N = KEYS[Math.min(KEYS.length - 1, i + 2)];
  const u = (t - A[0]) / (B[0] - A[0]);
  const cr = (p0, p1, p2, p3, s) => 0.5 * (2 * p1 + (-p0 + p2) * s + (2 * p0 - 5 * p1 + 4 * p2 - p3) * s * s + (-p0 + 3 * p1 - 3 * p2 + p3) * s * s * s);
  const s = u; const k = smooth(u);
  return { x: cr(P[1], A[1], B[1], N[1], s), z: cr(P[2], A[2], B[2], N[2], s), yaw: A[3] + (B[3] - A[3]) * k, pitch: A[4] + (B[4] - A[4]) * k };
}
const v = new THREE.Vector3();
function setPose(p) {
  v.set(p.x, 1.65, p.z); ROOM.localToWorld(v); camera.position.copy(v);
  camera.rotation.set(p.pitch * deg, p.yaw * deg + ROOM_YAW, 0);
  camera.updateMatrixWorld();
}
let manual = false;
window.__tourAt = (t) => { manual = false; setPose(poseAt(t)); draw(); };
window.__setPose = (p) => { manual = false; setPose(p); draw(); };
window.__tour = [0, 0.3, 0.6, 0.9].map(t => poseAt(t));

// diagnostic free camera (world coords) for close/far splat study

// ---------- live WASD + mouse look ----------
const keys = {}; let yaw = -70, pitch = -4, pos = { x: -10, z: -7.4 };
addEventListener('keydown', e => { keys[e.code] = true; if (!manual) { manual = true; } });
addEventListener('keyup', e => keys[e.code] = false);
let drag = false; addEventListener('mousedown', () => { drag = true; manual = true; }); addEventListener('mouseup', () => drag = false);
addEventListener('mousemove', e => { if (!drag) return; yaw -= e.movementX * 0.15; pitch = Math.max(-80, Math.min(80, pitch - e.movementY * 0.15)); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (manual) {
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0); const y = yaw * deg;
    pos.x += (-Math.sin(y) * f + Math.cos(y) * r) * 2.2 * dt; pos.z += (-Math.cos(y) * f - Math.sin(y) * r) * 2.2 * dt;
    pos.x = Math.max(-11.5, Math.min(11.6, pos.x)); pos.z = Math.max(-8.6, Math.min(8.6, pos.z));
    setPose({ x: pos.x, z: pos.z, yaw, pitch });
  }
  draw();
  requestAnimationFrame(loop);
}

// ---------- boot ----------
(async () => {

  for (let i = 0; i < 30; i++) { draw(); await new Promise(r => requestAnimationFrame(r)); }
